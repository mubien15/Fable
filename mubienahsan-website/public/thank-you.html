<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>The First Build — Mubien Ahsan</title>
<style>
  :root { --accent:#1C2B4A; }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       padding:24px;background:#FAF7F2;color:#1a1a1a;
       font:16px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
  .card{max-width:520px;width:100%;background:#fff;border:1px solid #eae3d8;border-radius:16px;
        padding:44px 38px;text-align:center;box-shadow:0 12px 36px rgba(0,0,0,.06)}
  .tick{width:56px;height:56px;border-radius:50%;background:#e8f5ec;color:#1f7a3d;
        display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 20px}
  h1{margin:0 0 12px;font-size:26px;line-height:1.25}
  p{margin:0 0 22px;color:#57504a}
  .btn{display:inline-block;padding:15px 30px;background:var(--accent);color:#fff;
       text-decoration:none;border-radius:9px;font-weight:600}
  .btn:hover{filter:brightness(1.12)}
  .fine{margin:26px 0 0;font-size:13px;color:#8a827a}
  a.plain{color:#57504a}
</style>
</head>
<body>
  <main class="card">
    <div class="tick" aria-hidden="true">&check;</div>
    <h1>You're confirmed</h1>
    <!-- Brevo redirects here only AFTER the visitor clicks the confirmation
         link, so anyone reading this has given express consent under CASL. -->
    <p>Thanks for confirming. <strong>The First Build</strong> is ready below, and I've emailed you a link too so you always have it.</p>

    <a class="btn" href="/the-first-build.pdf" download>Download The First Build</a>

    <p class="fine">
      Didn't get the email? Check your spam folder, or just
      <a class="plain" href="mailto:hello@mubienahsan.com">reply to me directly</a>.
    </p>
  </main>
</body>
</html>
